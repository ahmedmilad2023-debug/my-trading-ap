/* ======================================================================= */
/* Formatting helpers                                                       */

function formatPrice(p) {
  if (p === undefined || p === null || Number.isNaN(p)) return "—";
  if (p >= 1000) return p.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (p >= 1) return p.toFixed(2);
  return p.toFixed(4);
}
function formatPnl(p) {
  if (p === undefined || p === null) return "—";
  const sign = p >= 0 ? "+" : "";
  return `${sign}${p.toFixed(2)}%`;
}
function formatDateTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString("ar-EG", { calendar: "gregory", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  } catch { return "—"; }
}
function statusLabel(s) {
  return { active: "نشطة", hit_tp: "تحقق الهدف", hit_sl: "وقف الخسارة", archived: "مغلقة" }[s] || s;

/* ======================================================================= */
/* Binance market data                                                      */
/* ======================================================================= */
async function fetchKlines(symbol, interval, limit) {
  const res = await fetch(`${BINANCE}/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`);
  if (!res.ok) throw new Error("klines fetch failed");
  return res.json();
}
async function fetchTickerBatch(symbolsArr) {
  const param = encodeURIComponent(JSON.stringify(symbolsArr));
  const res = await fetch(`${BINANCE}/ticker/24hr?symbols=${param}`);
  if (!res.ok) throw new Error("ticker fetch failed");
  return res.json();
}

/* ======================================================================= */
/* Indicator engine — no RSI, no EMA. Stochastic %K, ROC, Wilder ADX,       */
/* and raw volume-flow comparison computed straight from candle data.       */
/* ======================================================================= */
function stochasticK(closes, highs, lows, period = 14) {
  if (closes.length < period) return 50;
  const rh = Math.max(...highs.slice(-period));
  const rl = Math.min(...lows.slice(-period));
  if (rh === rl) return 50;
  return ((closes[closes.length - 1] - rl) / (rh - rl)) * 100;
}
function rateOfChange(closes, period = 10) {
  if (closes.length < period + 1) return 0;
  const past = closes[closes.length - 1 - period];
  const last = closes[closes.length - 1];
  if (past === 0) return 0;
  return ((last - past) / past) * 100;
}
function trendFromStructure(closes, highs, lows) {
  const k = stochasticK(closes, highs, lows, 14);
  const roc = rateOfChange(closes, 10);
  if (roc > 0.05 && k > 55) return "Bullish";
  if (roc < -0.05 && k < 45) return "Bearish";
  return "Sideways";
}
function calcADX(highs, lows, closes, period = 14) {
  if (highs.length < period + 1) return 0;
  const plusDM = [], minusDM = [], tr = [];
  for (let i = 1; i < highs.length; i++) {
    const up = highs[i] - highs[i - 1];
    const down = lows[i - 1] - lows[i];
    plusDM.push(up > down && up > 0 ? up : 0);
    minusDM.push(down > up && down > 0 ? down : 0);
    tr.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1])));
  }
  const avg = (arr) => arr.slice(-period).reduce((a, b) => a + b, 0) / period;
  const atr = avg(tr);
  if (atr === 0) return 0;
  const diPlus = (avg(plusDM) / atr) * 100;
  const diMinus = (avg(minusDM) / atr) * 100;
  if (diPlus + diMinus === 0) return 0;
  return Math.round((Math.abs(diPlus - diMinus) / (diPlus + diMinus)) * 100);
}

async function buildCandidate(coin) {
  const [k1, k5, k15] = await Promise.all([
    fetchKlines(coin.symbol, "1m", 60),
    fetchKlines(coin.symbol, "5m", 60),
    fetchKlines(coin.symbol, "15m", 60),
  ]);
  const parse = (rows) => ({
    closes: rows.map(r => parseFloat(r[4])),
    highs: rows.map(r => parseFloat(r[2])),
    lows: rows.map(r => parseFloat(r[3])),
    vols: rows.map(r => parseFloat(r[5])),
  });
  const d1 = parse(k1), d5 = parse(k5), d15 = parse(k15);

  const tf1m = trendFromStructure(d1.closes, d1.highs, d1.lows);
  const tf5m = trendFromStructure(d5.closes, d5.highs, d5.lows);
  const tf15m = trendFromStructure(d15.closes, d15.highs, d15.lows);

  const stk = Math.round(stochasticK(d15.closes, d15.highs, d15.lows, 14));
  const roc = Math.round(rateOfChange(d15.closes, 10) * 10) / 10;
  const adxVal = calcADX(d15.highs, d15.lows, d15.closes, 14);

  const volRecent = d15.vols.slice(-5).reduce((a, b) => a + b, 0) / 5;
  const volPrev = d15.vols.slice(-10, -5).reduce((a, b) => a + b, 0) / 5;
  const volumeFlowPercent = volPrev === 0 ? 0 : Math.round(((volRecent - volPrev) / volPrev) * 100);

  const bullVotes = [tf1m, tf5m, tf15m].filter(t => t === "Bullish").length;
  const bearVotes = [tf1m, tf5m, tf15m].filter(t => t === "Bearish").length;

  let type = null;
  if (bullVotes >= 2 && stk > 40) type = "buy";
  else if (bearVotes >= 2 && stk < 60) type = "sell";
  if (!type) return null;

  let confidence = 50 + (type === "buy" ? bullVotes : bearVotes) * 10;
  if (adxVal >= 25) confidence += 10;
  if ((type === "buy" && volumeFlowPercent > 0) || (type === "sell" && volumeFlowPercent < 0)) confidence += 8;
  if (type === "buy" && roc > 0) confidence += 7;
  if (type === "sell" && roc < 0) confidence += 7;
  confidence = Math.min(95, Math.max(50, Math.round(confidence)));

  const entryPrice = d1.closes[d1.closes.length - 1];
  const targetPrice = type === "buy" ? entryPrice * 1.02 : entryPrice * 0.98;
  const stopLoss = type === "buy" ? entryPrice * 0.99 : entryPrice * 1.01;
  const votes = type === "buy" ? bullVotes : bearVotes;

  const reasoning = `${type === "buy" ? "إشارة شراء" : "إشارة بيع"} — توافق ${votes} من 3 فريمات زمنية على اتجاه ${type === "buy" ? "صاعد" : "نازل"}، STK عند ${stk}، ROC ${roc >= 0 ? "+" : ""}${roc}%، قوة الاتجاه (ADX) ${adxVal}` +
    (volumeFlowPercent !== 0 ? `، وتدفق سيولة ${volumeFlowPercent > 0 ? "متزايد" : "متراجع"} بنسبة ${Math.abs(volumeFlowPercent)}%.` : ".");

  return {
    id: `${coin.symbol}-${Date.now()}`,
    fullSymbol: coin.symbol, symbol: coin.short, name: coin.name, type,
    entryPrice, targetPrice, stopLoss, confidence, reasoning,
    currentPrice: entryPrice, pnlPercent: 0, status: "active",
    timestamp: new Date().toISOString(),
    stk, roc, adx: adxVal, volumeFlowPercent, tf1m, tf5m, tf15m, alertsEnabled: false,
  };
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function renderTickerStrip() {
  const wrap = document.getElementById("tickerStrip");
  wrap.innerHTML = "";
  if (tickers.length === 0) {
    for (let i = 0; i < 6; i++) {
      wrap.appendChild(el("div", "shrink-0 w-28 h-14 rounded-lg bg-slate-900 border border-slate-800 animate-pulse"));

    return;
  }
  tickers.forEach(t => {
    const up = t.change >= 0;
    const active = t.symbol === chartSymbol;
    const btn = el("button", `shrink-0 min-w-[7.5rem] text-right rounded-lg bg-slate-900 border px-2.5 py-1.5 ${active ? "border-sky-500/60" : "border-slate-800"}`);
    btn.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-semibold text-slate-200 mono">${t.short}</span>
        <span class="${up ? "text-emerald-400" : "text-rose-400"} text-xs">${up ? "▲" : "▼"}</span>

      <div class="text-[10px] mono ${up ? "text-emerald-400" : "text-rose-400"}">${up ? "+" : ""}${t.change.toFixed(2)}%</div>
    `;
    btn.onclick = () => { chartSymbol = t.symbol; renderTickerStrip(); populateChartSelectors(); loadChart(); };
    wrap.appendChild(btn);
  });
}

function populateChartSelectors() {
  const symSel = document.getElementById("chartSymbolSelect");
  if (symSel.options.length === 0) {
    WATCHLIST.forEach(w => {
      const o = el("option"); o.value = w.symbol; o.textContent = `${w.short}/USDT`;
      symSel.appendChild(o);
    });
  }
  symSel.value = chartSymbol;

  const ivSel = document.getElementById("chartIntervalSelect");
  if (ivSel.options.length === 0) {
    TF_OPTIONS.forEach(o => {
      const opt = el("option"); opt.value = o.binance; opt.textContent = o.label;
      ivSel.appendChild(opt);
    });
  }
  ivSel.value = chartInterval;
}

function drawCandlestickSVG(candles, width, height) {
  if (!candles || candles.length === 0) return "";
  const pad = { top: 10, right: 8, bottom: 18, left: 56 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;
  const highs = candles.map(c => c.high);
  const lows = candles.map(c => c.low);
  const max = Math.max(...highs);
  const min = Math.min(...lows);
  const range = max - min || 1;
  const slot = innerW / candles.length;
  const bodyW = Math.max(2, slot * 0.6);
  const yFor = (price) => pad.top + innerH - ((price - min) / range) * innerH;
  const gridLines = 4;
  const gridVals = Array.from({ length: gridLines + 1 }, (_, i) => min + (range * i) / gridLines);

  let svg = `<svg width="${width}" height="${height}" class="block">`;
  gridVals.forEach(v => {
    const y = yFor(v);
    svg += `<line x1="${pad.left}" x2="${width - pad.right}" y1="${y}" y2="${y}" stroke="#1e293b" stroke-width="1" />`;
    svg += `<text x="${pad.left - 6}" y="${y + 3}" font-size="9" fill="#64748b" text-anchor="end" font-family="monospace">${v >= 1000 ? v.toFixed(0) : v.toFixed(v >= 1 ? 2 : 4)}</text>`;
  });
  candles.forEach((c, i) => {
    const x = pad.left + i * slot + slot / 2;
    const up = c.close >= c.open;
    const color = up ? "#34d399" : "#fb7185";
    const bodyTop = yFor(Math.max(c.open, c.close));
    const bodyBottom = yFor(Math.min(c.open, c.close));
    const bodyHeight = Math.max(1, bodyBottom - bodyTop);
    svg += `<line x1="${x}" x2="${x}" y1="${yFor(c.high)}" y2="${yFor(c.low)}" stroke="${color}" stroke-width="1" />`;
    svg += `<rect x="${x - bodyW / 2}" y="${bodyTop}" width="${bodyW}" height="${bodyHeight}" fill="${color}" />`;
  });
  svg += `</svg>`;
  return svg;
}

let chartLoadToken = 0;
async function loadChart() {
  const myToken = ++chartLoadToken;
  const chartWrap = document.getElementById("chartWrap");
  const priceLine = document.getElementById("chartPriceLine");
  chartWrap.innerHTML = `<div class="w-full h-full flex items-center justify-center text-slate-600 text-xs">جار التحميل...</div>`;
  try {
    const rows = await fetchKlines(chartSymbol, chartInterval, 60);
    if (myToken !== chartLoadToken) return;
    const candles = rows.map(r => ({ time: r[0], open: parseFloat(r[1]), high: parseFloat(r[2]), low: parseFloat(r[3]), close: parseFloat(r[4]) }));
    let lastPrice = null, changePct = null;
    if (candles.length >= 2) {
      lastPrice = candles[candles.length - 1].close;
      const first = candles[0].open;
      changePct = ((lastPrice - first) / first) * 100;
    }
    priceLine.innerHTML = lastPrice !== null
      ? `<span class="font-bold mono">$${formatPrice(lastPrice)}</span><span class="mono ${changePct >= 0 ? "text-emerald-400" : "text-rose-400"}">${changePct >= 0 ? "+" : ""}${changePct.toFixed(2)}%</span>`
      : "";
    const width = chartWrap.clientWidth || 320;
    chartWrap.innerHTML = drawCandlestickSVG(candles, width, 280);
  } catch {
    if (myToken !== chartLoadToken) return;
    chartWrap.innerHTML = `<div class="w-full h-full flex items-center justify-center text-xs text-slate-500">تعذر تحميل بيانات الشارت</div>`;
  }
}

function tfChip(label, val) {
  if (!val) return "";
  const cls = val === "Bullish" ? "bg-emerald-500/10 text-emerald-400" : val === "Bearish" ? "bg-rose-500/10 text-rose-400" : "bg-slate-800 text-slate-400";
  const arrow = val === "Bullish" ? "↑" : val === "Bearish" ? "↓" : "→";
  return `<span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${cls}">${label} ${arrow}</span>`;
}

}

    <div class="grid grid-cols-3 gap-2 mt-2 pt-2 border-t border-slate-800">
      <div class="text-center"><div class="text-[10px] text-slate-500">سعر الدخول</div><div class="text-xs font-semibold mono">$${formatPrice(s.entryPrice)}</div></div>
      <div class="text-center"><div class="text-[10px] text-slate-500">السعر الحالي</div><div class="text-xs font-semibold mono">$${formatPrice(s.currentPrice)}</div></div>
      <div class="text-center"><div class="text-[10px] text-slate-500">الربح/الخسارة</div><div class="text-xs font-semibold mono ${s.pnlPercent >= 0 ? "text-emerald-400" : "text-rose-400"}">${formatPnl(s.pnlPercent)}</div></div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-slate-800">
      <div class="text-center"><div class="text-[10px] text-slate-500">الهدف</div><div class="text-xs font-medium mono ${s.type === "buy" ? "text-emerald-400" : "text-rose-400"}">$${formatPrice(s.targetPrice)}</div></div>
      <div class="text-center"><div class="text-[10px] text-slate-500">وقف الخسارة</div><div class="text-xs font-medium mono ${s.type === "buy" ? "text-rose-400" : "text-emerald-400"}">$${formatPrice(s.stopLoss)}</div></div>
    </div>
    <div class="mt-2 pt-2 border-t border-slate-800 flex flex-wrap gap-1.5">
      <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${s.stk > 50 ? "bg-emerald-500/10 text-emerald-400" : "bg-rose-500/10 text-rose-400"}">STK ${s.stk}</span>
      <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${s.roc >= 0 ? "bg-emerald-500/10 text-emerald-400" : "bg-rose-500/10 text-rose-400"}">ROC ${s.roc >= 0 ? "+" : ""}${s.roc}%</span>
      <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${s.volumeFlowPercent >= 0 ? "bg-emerald-500/10 text-emerald-400" : "bg-rose-500/10 text-rose-400"}">MF ${s.volumeFlowPercent >= 0 ? "+" : ""}${s.volumeFlowPercent}%</span>
      <span class="text-[10px] px-1.5 py-0.5 rounded font-medium ${s.adx >= 25 ? "bg-sky-500/10 text-sky-400" : "bg-slate-800 text-slate-400"}">ADX ${s.adx}</span>
    </div>
    <div class="mt-2 pt-2 border-t border-slate-800">
      <div class="text-[10px] text-slate-500 mb-1">توافق الفريمات:</div>
      <div class="flex flex-wrap gap-1.5">${tfChip("1m", s.tf1m)}${tfChip("5m", s.tf5m)}${tfChip("15m", s.tf15m)}</div>
    </div>
    <div class="mt-2 pt-2 border-t border-slate-800 flex items-start gap-1.5">
      <span class="text-sky-400 text-xs">✨</span><p class="text-xs text-slate-400 leading-relaxed">${s.reasoning}</p>
    </div>
    <div class="mt-2 text-[10px] text-slate-500 flex items-center gap-1 justify-end mono">🕒 ${formatDateTime(s.timestamp)}</div>
  `;
  card.querySelector(".alertBtn").onclick = () => toggleAlerts(s.id);
  card.querySelector(".shareBtn").onclick = async (e) => {
    const ok = await copyToClipboard(buildShareMessage(s));
    if (ok) {
      const btn = e.currentTarget;
      const note = el("span", "absolute -top-5 left-1/2 -translate-x-1/2 text-[9px] bg-sky-500 text-slate-950 px-1.5 py-0.5 rounded whitespace-nowrap font-semibold", "تم النسخ!");
      btn.appendChild(note);
      setTimeout(() => note.remove(), 2000);
    }
  };
  card.querySelector(".closeBtn").onclick = () => archiveSignal(s.id);
  return card;
}

function closedSignalCard(s) {
  const card = el("div", "bg-slate-900 border border-slate-800 rounded-lg p-3 opacity-70 mb-2");
  card.innerHTML = `
    <div class="flex items-center justify-between mb-1">
      <div class="flex items-center gap-2">
        <span class="${s.type === "buy" ? "text-emerald-400" : "text-rose-400"}">${s.type === "buy" ? "▲" : "▼"}</span>
        <span class="text-sm font-medium mono">${s.symbol}</span>
        <span class="text-[10px] font-medium px-1.5 py-0.5 rounded ${statusClasses(s.status)}">${statusLabel(s.status)}</span>
      </div>
      <button class="shareBtn p-1 rounded hover:bg-slate-800 relative"><span class="text-slate-500">↗</span></button>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-1">
      <div class="text-center"><div class="text-[10px] text-slate-500">الدخول</div><div class="text-xs font-medium mono">$${formatPrice(s.entryPrice)}</div></div>
      <div class="text-center"><div class="text-[10px] text-slate-500">الإغلاق</div><div class="text-xs font-medium mono">$${formatPrice(s.currentPrice)}</div></div>
      <div class="text-center"><div class="text-[10px] text-slate-500">النتيجة</div><div class="text-xs font-medium mono ${s.pnlPercent >= 0 ? "text-emerald-400" : "text-rose-400"}">${formatPnl(s.pnlPercent)}</div></div>
    </div>
    <div class="mt-1 text-[10px] text-slate-500 flex items-center gap-1 justify-end mono">🕒 ${formatDateTime(s.timestamp)}</div>
  `;
  card.querySelector(".shareBtn").onclick = async (e) => {
    const ok = await copyToClipboard(buildShareMessage(s));
    if (ok) {
      const btn = e.currentTarget;
      const note = el("span", "absolute -top-5 left-1/2 -translate-x-1/2 text-[9px] bg-sky-500 text-slate-950 px-1.5 py-0.5 rounded whitespace-nowrap font-semibold", "تم النسخ!");
      btn.appendChild(note);
      setTimeout(() => note.remove(), 2000);
    }
  };
  return card;
}

function renderSignals() {
  const list = document.getElementById("signalsList");
  list.innerHTML = "";
  const active = signals.filter(s => s.status === "active");
  const closed = signals.filter(s => s.status !== "active");

  if (active.length === 0 && closed.length === 0) {
    list.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">لا توجد إشارات حالياً — اضغط "توليد إشارات" لتحليل السوق المباشر</div>`;
    renderLockedSymbols();
    return;
  }
  active.forEach(s => list.appendChild(activeSignalCard(s)));
  if (closed.length > 0) {
    const heading = el("h3", "text-xs font-medium text-slate-500 mb-2 pt-2", "إشارات منتهية");
    list.appendChild(heading);
    closed.forEach(s => list.appendChild(closedSignalCard(s)));
  }
  renderLockedSymbols();
}

function showNotice(msg) {
  const n = document.getElementById("notice");
  if (!msg) { n.classList.add("hidden"); n.textContent = ""; return; }
  n.textContent = msg;
  n.classList.remove("hidden");
}

function renderLastUpdated() {
  const wrap = document.getElementById("lastUpdated");
  if (!lastUpdated) { wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  wrap.innerHTML = `🕒 آخر توليد: ${formatDateTime(lastUpdated.toISOString())}`;
}

/* ======================================================================= */
/* Actions                                                                  */
/* ======================================================================= */
function persist() { saveSignalsToStorage(); renderSignals(); }

function toggleAlerts(id) {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
  signals = signals.map(s => s.id === id ? { ...s, alertsEnabled: !s.alertsEnabled } : s);
  persist();
}
function archiveSignal(id) {
  signals = signals.map(s => s.id === id ? { ...s, status: "archived" } : s);
  persist();
}

async function refreshTickers() {
  try {
    const data = await fetchTickerBatch(WATCHLIST.map(w => w.symbol));
    const map = Object.fromEntries(WATCHLIST.map(w => [w.symbol, w]));
    tickers = data.map(d => {
      const meta = map[d.symbol];
      if (!meta) return null;
      return { symbol: d.symbol, short: meta.short, price: parseFloat(d.lastPrice), change: parseFloat(d.priceChangePercent) };
    }).filter(Boolean);
    showNotice(null);
    renderTickerStrip();
  } catch {
    showNotice("تعذر الوصول إلى بيانات Binance حالياً — تحقق من اتصال الشبكة.");
  }
}

async function refreshActiveSignalPrices() {
  const active = signals.filter(s => s.status === "active");
  if (active.length === 0) return;
  try {
    const data = await fetchTickerBatch([...new Set(active.map(s => s.fullSymbol))]);
    const priceMap = Object.fromEntries(data.map(d => [d.symbol, parseFloat(d.lastPrice)]));
    signals = signals.map(s => {
      if (s.status !== "active") return s;
      const price = priceMap[s.fullSymbol];
      if (price === undefined) return s;
      const pnlPercent = s.type === "buy" ? ((price - s.entryPrice) / s.entryPrice) * 100 : ((s.entryPrice - price) / s.entryPrice) * 100;
      let status = "active";
      if (s.type === "buy" && price >= s.targetPrice) status = "hit_tp";
      else if (s.type === "buy" && price <= s.stopLoss) status = "hit_sl";
      else if (s.type === "sell" && price <= s.targetPrice) status = "hit_tp";
      else if (s.type === "sell" && price >= s.stopLoss) status = "hit_sl";

      if (status !== "active" && s.alertsEnabled && "Notification" in window && Notification.permission === "granted") {
        new Notification(`${s.name} (${s.symbol})`, { body: status === "hit_tp" ? "تحقق الهدف 🎯" : "تم الوصول لوقف الخسارة 🛑" });
      }
      return { ...s, currentPrice: price, pnlPercent, status };
    });
    persist();
  } catch { /* keep last known values */ }
}

async function generateSignals() {
  if (generating) return;
  generating = true;
  const btn = document.getElementById("generateBtn");
  btn.disabled = true;
  btn.innerHTML = `<span class="animate-spin inline-block">↻</span> جاري التحليل...`;
  try {
    const locked = new Set(signals.filter(s => s.status === "active").map(s => s.fullSymbol));
    const candidates = [];
    for (const coin of WATCHLIST) {
      if (locked.has(coin.symbol)) continue;
      try {
        const c = await buildCandidate(coin);
        if (c) candidates.push(c);
      } catch { /* skip symbol on failure */ }
    }
    candidates.sort((a, b) => b.confidence - a.confidence);
    const chosen = candidates.slice(0, MAX_NEW_SIGNALS_PER_ROUND);
    if (chosen.length > 0) {
      signals = [...chosen, ...signals];
      lastUpdated = new Date();
      saveSignalsToStorage();
      renderSignals();
      renderLastUpdated();
    } else {
      showNotice("لا توجد فرص توافق حالياً حسب المؤشرات — حاول مجدداً بعد قليل.");
    }
  } finally {
    generating = false;
    btn.disabled = false;
    btn.innerHTML = `↻ توليد إشارات`;
  }
}

/* ======================================================================= */
/* Init                                                                     */
/* ======================================================================= */
function init() {
  signals = loadSignalsFromStorage();
  renderSignals();
  populateChartSelectors();

  document.getElementById("chartSymbolSelect").addEventListener("change", (e) => { chartSymbol = e.target.value; loadChart(); });
  document.getElementById("chartIntervalSelect").addEventListener("change", (e) => { chartInterval = e.target.value; loadChart(); });
  document.getElementById("generateBtn").addEventListener("click", generateSignals);
  document.getElementById("refreshTickersBtn").addEventListener("click", refreshTickers);

  refreshTickers();
  loadChart();

  setInterval(refreshTickers, REFRESH_MS);
  setInterval(refreshActiveSignalPrices, REFRESH_MS);
  setInterval(loadChart, REFRESH_MS);
}

document.addEventListener("DOMContentLoaded", init);
</script>
